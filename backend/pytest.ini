[pytest]
testpaths = tests
python_files = test_*.py
addopts = --strict-markers
# A virtualenv inside the repo would otherwise be walked for tests, which
# produces phantom collection errors against the installed site-packages.
norecursedirs = .* .cv venv .venv env ENV dev-venv node_modules __pycache__ *.egg
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning:rasterio
